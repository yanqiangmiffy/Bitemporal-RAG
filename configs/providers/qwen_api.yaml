# Preliminary CPU/API run: Qwen3-32B via SiliconFlow (OpenAI-compatible, stable).
# The user's self-hosted Qwen endpoint was intermittently 503, so we serve the
# same model family through SiliconFlow. No GPU here -> dense embeddings and the
# cross-encoder reranker are OFF; retrieval is BM25-only (rank_bm25). The core
# as-of / Flim claims live in the store, so this suffices for idea validation.
#   export SILICONFLOW_API_KEY=sk-...
#   asof-run --domain <d> --method <m> --override configs/providers/qwen_api.yaml
llm:
  provider: siliconflow          # OpenAI-compatible branch in llm/client.py
  base_url: https://api.siliconflow.cn/v1
  api_key_env: SILICONFLOW_API_KEY
  extractor_model: Qwen/Qwen3-32B
  classifier_model: Qwen/Qwen3-32B
  generator_model: Qwen/Qwen3-32B
  temperature: 0.0
  max_tokens: 8192               # Qwen3-32B has a 256k context; headroom so JSON never truncates
  max_retries: 5
  cache: true
  extra_body:                    # SiliconFlow takes enable_thinking at top level
    enable_thinking: false

retrieval:
  bm25: true
  dense: false                   # no GPU / embedding not wired for this pass
  rerank: false                  # no cross-encoder on CPU

embeddings:
  device: cpu
