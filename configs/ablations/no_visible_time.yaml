# Ablation: drop the visible-time axis -> single-timeline store.
# Expected to collapse on Unseen (asked-before-publication); Win is unaffected
# because valid-time alone already resolves it (see paper §Experiments/Ablation).
method:
  name: asof
  use_visible_time: false
  use_condition_split: true
  use_exact_id_match: true
