# Ablation: replace the 32B extractor with a smaller model, everything else equal.
# Expected to degrade extraction/scope quality and hence accuracy.
# (Preliminary CPU/API run: SiliconFlow's smallest served Qwen is 7B, so we use
#  Qwen2.5-7B vs the Qwen3-32B default; sub-1B variants are not hosted.)
llm:
  extractor_model: Qwen/Qwen2.5-7B-Instruct
method:
  name: asof
  use_visible_time: true
  use_condition_split: true
  use_exact_id_match: true
